name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1 (required for Duo edge-to-edge support)
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $SDK"
          test "$SDK" = "27.1" || { echo "ERROR: iOS 27.1 SDK required"; exit 1; }
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS application
        run: |
          xcodebuild -project SundayMissal.xcodeproj -scheme SundayMissal -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SundayMissal.app Payload/
          zip -qry SundayMissal-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SundayMissal-unsigned-IPA
          path: SundayMissal-unsigned.ipa
          if-no-files-found: error
